<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LincolnGenerator</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --bg:#000; --surface:#0c0c0e; --surface2:#141417; --line:#232327;
  --text:#f4f4f5; --muted:#76767f;
  --radius:16px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  min-height:100vh; padding-bottom:96px;
}
/* header */
.app-header{
  position:sticky;top:0;z-index:10;
  background:rgba(0,0,0,.88); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  padding:18px 16px 12px; border-bottom:1px solid var(--line);
}
.app-header h1{
  margin:0;font-size:21px;font-weight:800;letter-spacing:.2px;color:#fff;
  text-shadow:0 1px 0 rgba(255,255,255,.08), 0 2px 3px rgba(0,0,0,.9);
}
nav.tabs{
  display:flex;gap:7px;position:sticky;top:58px;z-index:9;
  background:rgba(0,0,0,.88); backdrop-filter:blur(12px);
  padding:10px 12px;overflow-x:auto;border-bottom:1px solid var(--line);
}
nav.tabs::-webkit-scrollbar{display:none}
.tab{
  flex:0 0 auto;display:inline-flex;align-items:center;gap:8px;
  border:1px solid var(--line);cursor:pointer;font-family:inherit;
  font-weight:600;font-size:13px;color:var(--muted);background:var(--surface);
  border-radius:50px;padding:9px 15px;transition:.2s;
}
.tab.active{background:var(--text);color:#000;border-color:var(--text);box-shadow:0 4px 14px rgba(0,0,0,.8)}
/* 3D icons */
.icon3d{
  width:18px;height:18px;border-radius:50%;flex:0 0 auto;
  background:radial-gradient(circle at 32% 28%, #4a4a52, #0a0a0c 70%);
  box-shadow:inset 0 -2px 3px rgba(0,0,0,.9), inset 0 1px 2px rgba(255,255,255,.28);
  display:inline-block;position:relative;
}
.icon3d::after{
  content:"";position:absolute;left:26%;top:16%;width:30%;height:22%;
  background:rgba(255,255,255,.35);border-radius:50%;filter:blur(1px);
}
.tab.active .icon3d{
  background:radial-gradient(circle at 32% 28%, #cfcfd4, #66666e 70%);
}
main{max-width:480px;margin:0 auto;padding:16px 12px}
section.page{display:none}
section.page.active{display:block;animation:pageIn .35s ease}
@keyframes pageIn{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px;margin-bottom:12px;
}
.card > h2{display:none}
label{display:block;font-size:12px;color:var(--muted);margin:12px 0 7px;font-weight:600;letter-spacing:.3px;text-transform:uppercase}
input[type=text]{
  width:100%;background:var(--surface2);border:1px solid var(--line);color:var(--text);
  border-radius:12px;padding:13px 15px;font-size:15px;font-family:inherit;outline:none;transition:.2s;
}
input[type=text]:focus{border-color:#55555e}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  background:var(--text);color:#000;border:none;border-radius:50px;
  padding:14px 20px;font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;width:100%;transition:.15s;
  box-shadow:0 6px 16px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.5);
}
.btn:active{transform:scale(.97)}
.btn.ghost{background:var(--surface2);color:var(--text);border:1px solid var(--line);box-shadow:none}
.btn.small{width:auto;padding:9px 14px;font-size:13px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:8px}
.row .btn{flex:1}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{
  background:var(--surface2);border:1px solid var(--line);color:var(--muted);border-radius:50px;
  padding:9px 14px;font-size:13px;cursor:pointer;font-family:inherit;transition:.15s;
}
.chip.active{background:var(--text);color:#000;border-color:var(--text);font-weight:700}
/* nick result */
.nick-result{margin-top:18px;text-align:center;padding:18px 10px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface2)}
.nick-status{font-size:11px;font-weight:700;letter-spacing:1px;color:var(--muted);text-transform:uppercase;margin-bottom:10px}
.nick-status.free{color:#4ade80}
.nick-status.taken{color:#f87171}
.nick-status.unknown{color:#a3a3ad}
.nick-name{
  font-size:27px;font-weight:800;color:#fff;word-break:break-word;line-height:1.25;
  text-shadow:0 1px 0 rgba(255,255,255,.1), 0 3px 6px rgba(0,0,0,.9);
}
.nick-actions{display:flex;gap:8px;margin-top:16px;justify-content:center;flex-wrap:wrap}
.nick-actions .btn{width:auto}
.spinner{
  width:16px;height:16px;border:2px solid #000;border-top-color:transparent;
  border-radius:50%;animation:spin .7s linear infinite;display:inline-block;vertical-align:-3px;
}
@keyframes spin{to{transform:rotate(360deg)}}
/* sticker */
.tpl-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}
.tpl{
  position:relative;border-radius:12px;overflow:hidden;aspect-ratio:1;cursor:pointer;
  border:2px solid var(--line);transition:.2s;
  display:flex;align-items:center;justify-content:center;font-weight:800;color:#fff;font-size:11px;
  background:var(--surface2);
}
.tpl.active{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,.25)}
.tpl .lock{position:absolute;top:5px;right:5px;background:rgba(0,0,0,.7);color:#fff;font-size:11px;border-radius:8px;padding:2px 6px;font-weight:700;border:1px solid var(--line)}
.sticker-stage{
  position:relative;margin:16px auto;width:min(250px,66vw);aspect-ratio:1;border-radius:20px;overflow:hidden;
  box-shadow:0 14px 40px rgba(0,0,0,.85);border:1px solid var(--line);
}
.sticker-stage canvas{width:100%;height:100%;display:block}
.premium-line{color:var(--muted);font-size:12px;margin-top:10px}
/* fonts */
.font-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.font-item{
  background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;
  cursor:pointer;transition:.15s;
}
.font-item:active{background:#1a1a1f}
.font-item .fname{font-size:10.5px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.5px}
.font-item .fprev{font-size:17px;margin-top:5px;word-break:break-word;line-height:1.3;color:#fff}
.footer{color:#4a4a52;font-size:11px;text-align:center;padding:16px 12px 6px}
modal{display:none}
.toast{
  position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1a1a1f;color:#fff;
  padding:10px 18px;border-radius:50px;font-size:13px;font-weight:600;z-index:99;
  border:1px solid var(--line);transition:opacity .3s;opacity:0;pointer-events:none;white-space:nowrap;
}
</style>
</head>
<body>

<header class="app-header"><h1>LincolnGenerator</h1></header>

<nav class="tabs">
  <button class="tab active" data-page="nicks"><span class="icon3d"></span>Юзернем</button>
  <button class="tab" data-page="stickers"><span class="icon3d"></span>Создать стикер</button>
  <button class="tab" data-page="fonts"><span class="icon3d"></span>Шрифты</button>
</nav>

<main>
  <section class="page active" id="page-nicks">
    <div class="card">
      <input type="text" id="nickSeed" placeholder="Ключевое слово" style="margin-top:0">
      <label>Стиль</label>
      <div class="chips" id="nickStyleChips">
        <span class="chip active" data-v="short">Короткий</span>
        <span class="chip" data-v="stylish">Стильный</span>
        <span class="chip" data-v="rare">Редкий</span>
      </div>
      <button class="btn" id="nickGenBtn" style="margin-top:16px">Сгенерировать</button>
      <div class="nick-result" id="nickResult" style="display:none">
        <div class="nick-status" id="nickStatus">Свободен</div>
        <div class="nick-name" id="nickOut">@never</div>
        <div class="nick-actions">
          <button class="btn small" id="nickCopy">Копировать</button>
          <button class="btn small ghost" id="nickAgain">Ещё</button>
        </div>
      </div>
    </div>
  </section>

  <section class="page" id="page-stickers">
    <div class="card">
      <input type="text" id="stickerText" placeholder="Текст" maxlength="14" style="margin-top:0">
      <label>Шаблон</label>
      <div class="tpl-grid" id="tplGrid"></div>
      <div class="sticker-stage"><canvas id="stickerCanvas" width="512" height="512"></canvas></div>
      <div class="premium-line" id="premiumNotice" style="display:none">Premium или 1 ⭐</div>
      <div class="row" style="margin-top:12px">
        <button class="btn" id="stickerDownload">Скачать PNG</button>
      </div>
    </div>
  </section>

  <section class="page" id="page-fonts">
    <div class="card">
      <input type="text" id="fontInput" placeholder="Текст" style="margin-top:0">
      <div class="font-list" id="fontList"></div>
    </div>
  </section>

  <div class="footer">LincolnGenerator</div>
</main>

<div class="toast" id="toast"></div>

<script>
'use strict';

const TG_PAY_CONFIG = { invoiceUrl: "" };
const API_BASE = location.origin + '/api/check-username';

/* ============ Telegram ============ */
let TG = null;
try{
  if(window.Telegram && Telegram.WebApp){ TG = Telegram.WebApp; TG.ready(); TG.expand(); }
}catch(e){}

function isPremiumUser(){
  try{
    const u = TG && TG.initDataUnsafe && TG.initDataUnsafe.user;
    if(u && u.is_premium) return true;
    return localStorage.getItem('lg_premium') === '1';
  }catch(e){ return false; }
}

/* ============ Toast / tabs ============ */
function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.opacity = '1';
  clearTimeout(t._h); t._h = setTimeout(()=>{ t.style.opacity = '0'; }, 1500);
}
document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    document.querySelectorAll('section.page').forEach(s=>s.classList.remove('active'));
    document.getElementById('page-'+t.dataset.page).classList.add('active');
  });
});
function copyText(txt, ok){
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).then(()=>toast(ok||'Скопировано')).catch(()=>fallbackCopy(txt));
  } else fallbackCopy(txt);
}
function fallbackCopy(txt){
  const ta = document.createElement('textarea');
  ta.value = txt; ta.style.position='fixed'; ta.style.opacity='0';
  document.body.appendChild(ta); ta.select();
  try{ document.execCommand('copy'); }catch(e){}
  document.body.removeChild(ta); toast('Скопировано');
}

/* ============ Проверка занятости ============ */
async function checkNick(n){
  try{
    const r = await fetch(API_BASE + '?username=' + encodeURIComponent(n), { signal: AbortSignal.timeout(8000) });
    if(!r.ok) return 'unknown';
    const d = await r.json();
    if(d.taken === true) return 'taken';
    if(d.taken === false) return 'free';
    return 'unknown';
  }catch(e){ return 'unknown'; }
}

/* ============ Ники ============ */
const NICK_STYLES = {
  short: {
    base:['lynx','zeph','nox','vek','orx','kyn','zed','rapt','onix','neq','vexx','kro','zylo','nvex','trex','verd','huiz','phnx','lyre','cryo'],
    tail:['x','k','o','a','e','z','n','r'] // короткие хвосты
  },
  stylish: {
    base:['velvet','neon','midnight','chrome','spectrum','velocity','cipher','modem','vertex','aurora','onyx','cosmic','echo','sable','optic'],
    tail:['.l','_n','_mx','_x','.v','_d','_one','ish']
  },
  rare: {
    base:['solstice','aphelion','quasar','umbra','synapse','cathode','halcyon','notch','ephemera','obscura','lexicon','vertigo','mirage','symmetry','zenith'],
    tail:['#','_x','x_','_1','_7','zz','_v','_n','_k']
  }
};
function rnd(a){ return a[Math.floor(Math.random()*a.length)]; }
function genNick(){
  const s = document.querySelector('#nickStyleChips .chip.active');
  const style = (s && s.dataset.v) || 'short';
  const pool = NICK_STYLES[style] || NICK_STYLES.short;
  const seed = document.getElementById('nickSeed').value.trim().replace(/[^a-zA-Z0-9_]/g,'');
  if(seed){
    const variations = ['','','_','_x','x','_n','z','x'];
    let n = seed + rnd(variations);
    if(n.length < 4) n = seed + rnd(pool.tail);
    return n.length <= 20 ? n : seed.slice(0,16);
  }
  return rnd(pool.base) + rnd(pool.tail);
}
function setGenerating(on){
  const b = document.getElementById('nickGenBtn');
  b.disabled = on;
  b.innerHTML = on ? '<span class="spinner"></span> Проверяю' : 'Сгенерировать';
}
async function showFreeNick(){
  setGenerating(true);
  const box = document.getElementById('nickResult');
  box.style.display = 'block';
  document.getElementById('nickStatus').textContent = 'Подбираю';
  document.getElementById('nickStatus').className = 'nick-status unknown';
  document.getElementById('nickOut').textContent = '…';
  let last = null;
  for(let i=0;i<10;i++){
    const n = genNick();
    last = n;
    const st = await checkNick(n);
    if(st === 'free'){ renderNick(n, 'free'); setGenerating(false); return; }
    if(st === 'unknown'){ renderNick(n, 'unknown'); setGenerating(false); return; }
    await new Promise(r=>setTimeout(r,140));
  }
  renderNick(last, 'unknown');
  setGenerating(false);
}
function renderNick(n, st){
  document.getElementById('nickOut').textContent = '@' + n;
  const el = document.getElementById('nickStatus');
  if(st === 'free'){ el.textContent = 'Свободен'; el.className = 'nick-status free'; }
  else if(st === 'taken'){ el.textContent = 'Занят'; el.className = 'nick-status taken'; }
  else { el.textContent = 'Не проверен (нет API)'; el.className = 'nick-status unknown'; }
  document.getElementById('nickAgain').onclick = ()=> showFreeNick();
  document.getElementById('nickCopy').onclick = ()=> copyText(n, 'Ник скопирован');
}
document.getElementById('nickGenBtn').addEventListener('click', showFreeNick);
document.getElementById('nickSeed').addEventListener('keydown', e=>{ if(e.key==='Enter') showFreeNick(); });
document.querySelectorAll('#nickStyleChips .chip').forEach(c=>{
  c.addEventListener('click', ()=>{
    document.querySelectorAll('#nickStyleChips .chip').forEach(x=>x.classList.remove('active'));
    c.classList.add('active');
  });
});

/* ============ Стикеры ============ */
const STICKER_BG = [
  { id:'pure',    name:'Чёрный',  premium:false, kind:'pure'  },
  { id:'frame',   name:'Рамка',   premium:false, kind:'frame' },
  { id:'grid',    name:'Сетка',   premium:false, kind:'grid'  },
  { id:'dots',    name:'Точки',   premium:false, kind:'dots'  },
  { id:'halo',    name:'Ореол',   premium:true,  kind:'halo'  },
  { id:'chrome',  name:'Хром',    premium:true,  kind:'chrome'},
  { id:'lines',   name:'Линии',   premium:true,  kind:'lines' },
  { id:'blur',    name:'Дымка',   premium:true,  kind:'blur'  }
];
let curTpl = 0;
const cv = document.getElementById('stickerCanvas');
const ctx = cv.getContext('2d');

function drawSticker(){
  const t = STICKER_BG[curTpl];
  const text = (document.getElementById('stickerText').value.trim() || 'ник');
  const S = 512;
  ctx.clearRect(0,0,S,S);

  // чистый чёрный фон
  ctx.fillStyle = '#000';
  ctx.fillRect(0,0,S,S);

  if(t.kind === 'frame'){
    ctx.strokeStyle = '#f4f4f5'; ctx.lineWidth = 14;
    ctx.strokeRect(28,28,S-56,S-56);
  }
  if(t.kind === 'grid'){
    ctx.strokeStyle = 'rgba(255,255,255,.5)'; ctx.lineWidth = 3;
    ctx.beginPath();
    for(let i=0;i<=S;i+=64){ ctx.moveTo(i,0); ctx.lineTo(i,S); ctx.moveTo(0,i); ctx.lineTo(S,i); }
    ctx.stroke();
  }
  if(t.kind === 'dots'){
    ctx.fillStyle = 'rgba(255,255,255,.55)';
    for(let y=20;y<S;y+=32){ for(let x=20;x<S;x+=32){ ctx.beginPath(); ctx.arc(x,y,4,0,Math.PI*2); ctx.fill(); } }
  }
  if(t.kind === 'halo'){
    const g = ctx.createRadialGradient(S/2,S/2,10,S/2,S/2,S*0.7);
    g.addColorStop(0,'rgba(60,60,68,.95)'); g.addColorStop(.6,'rgba(30,30,34,.4)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,S,S);
  }
  if(t.kind === 'chrome'){
    const g = ctx.createLinearGradient(0,0,S,S);
    g.addColorStop(0,'#2a2a30'); g.addColorStop(.5,'#0d0d0f'); g.addColorStop(1,'#34343c');
    ctx.fillStyle = g; ctx.fillRect(0,0,S,S);
  }
  if(t.kind === 'lines'){
    ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 5;
    for(let i=-S;i<S*2;i+=34){ ctx.beginPath(); ctx.moveTo(i,0); ctx.lineTo(i+S,S); ctx.stroke(); }
  }
  if(t.kind === 'blur'){
    const g = ctx.createRadialGradient(S/2,S/2,50,S/2,S/2,S);
    g.addColorStop(0,'rgba(70,70,80,.9)'); g.addColorStop(.7,'rgba(20,20,24,.5)'); g.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle = g; ctx.fillRect(0,0,S,S);
  }

  ctx.textAlign='center'; ctx.textBaseline='middle';
  let fs = 150;
  ctx.font = '800 ' + fs + 'px -apple-system,"Segoe UI",sans-serif';
  while(ctx.measureText(text).width > S*0.8 && fs > 26){ fs -= 8; ctx.font='800 '+fs+'px -apple-system,"Segoe UI",sans-serif'; }
  const cx = S/2, cy = S/2;
  ctx.lineJoin = 'round';
  if(t.kind === 'pure' || t.kind === 'chrome'){
    // белый текст с мягкой тенью
    ctx.shadowColor = 'rgba(255,255,255,.25)'; ctx.shadowBlur = 24;
    ctx.fillStyle = '#fff';
    ctx.fillText(text,cx,cy);
    ctx.shadowBlur = 0;
  } else {
    ctx.strokeStyle = '#000'; ctx.lineWidth = Math.max(8, fs*0.12); ctx.strokeText(text,cx,cy);
    ctx.fillStyle = '#fff'; ctx.fillText(text,cx,cy);
  }
}
document.getElementById('stickerText').addEventListener('input', drawSticker);

function buildTplGrid(){
  const grid = document.getElementById('tplGrid'); grid.innerHTML = '';
  STICKER_BG.forEach((t,i)=>{
    const c = document.createElement('div');
    c.className = 'tpl' + (i===curTpl?' active':'');
    c.style.background = t.kind==='chrome' ? 'linear-gradient(135deg,#2a2a30,#0d0d0f)' : '#111114';
    c.textContent = t.name;
    if(t.premium) c.innerHTML = t.name + '<span class="lock">★</span>';
    c.addEventListener('click', ()=>{
      curTpl = i;
      grid.querySelectorAll('.tpl').forEach(x=>x.classList.remove('active'));
      c.classList.add('active');
      updatePremiumUI(); drawSticker();
    });
    grid.appendChild(c);
  });
}
function updatePremiumUI(){
  const t = STICKER_BG[curTpl];
  const locked = t.premium && !isPremiumUser();
  document.getElementById('premiumNotice').style.display = locked ? 'block' : 'none';
}
document.getElementById('stickerDownload').addEventListener('click', ()=>{
  cv.toBlob(blob=>{
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'sticker.png';
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ URL.revokeObjectURL(url); a.remove(); }, 300);
    toast('Скачано');
  },'image/png');
});
buildTplGrid(); drawSticker(); updatePremiumUI();

/* ============ Шрифты ============ */
function rangeMap(u,l,d){
  const m = {};
  for(let i=0;i<26;i++) m[String.fromCharCode(65+i)] = String.fromCharCode(u+i);
  for(let i=0;i<26;i++) m[String.fromCharCode(97+i)] = String.fromCharCode(l+i);
  for(let i=0;i<10;i++){
    const c = String.fromCharCode(48+i);
    m[c] = d ? (i===0 ? String.fromCharCode(0x24EA) : String.fromCharCode(0x2460+i-1)) : c;
  }
  return m;
}
const FONTS = [
  {id:'bold', name:'Жирный', map:()=>rangeMap(0x1D400,0x1D41A,0x1D7CE)},
  {id:'italic', name:'Курсив', map:()=>rangeMap(0x1D434,0x1D44E,null)},
  {id:'bi', name:'Жирный курсив', map:()=>rangeMap(0x1D468,0x1D482,null)},
  {id:'sans', name:'Гротеск', map:()=>rangeMap(0x1D5A0,0x1D5BA,null)},
  {id:'sansb', name:'Гротеск жирный', map:()=>rangeMap(0x1D5D4,0x1D5EE,null)},
  {id:'mono', name:'Моно', map:()=>rangeMap(0x1D670,0x1D68A,null)},
  {id:'circ', name:'Круги', map:()=>rangeMap(0x24B6,0x24D0,true)}
];
const _m = {};
function fontMap(id){ if(!_m[id]){ const s = FONTS.find(x=>x.id===id); _m[id] = s ? s.map() : {}; } return _m[id]; }
function convert(t,id){ const m = fontMap(id); let o=''; for(const ch of t) o += (m[ch]||ch); return o; }
function esc(s){ return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fillFonts(){
  const inp = document.getElementById('fontInput').value;
  const list = document.getElementById('fontList'); list.innerHTML='';
  FONTS.forEach(f=>{
    const it = document.createElement('div'); it.className = 'font-item';
    const prev = inp ? convert(inp, f.id) : 'Стиль';
    it.innerHTML = '<div class="fname">'+f.name+'</div><div class="fprev">'+esc(prev)+'</div>';
    it.addEventListener('click', ()=>{ if(inp) copyText(prev, 'Скопировано'); });
    list.appendChild(it);
  });
}
document.getElementById('fontInput').addEventListener('input', fillFonts);
fillFonts();
</script>
</body>
</html>
